<svg xmlns="http://www.w3.org/2000/svg" width="272" height="72" viewBox="0 0 272 72">
  <!-- ats-cctv logo (static). Drag into Figma: shapes stay editable, the word is live text in Outfit. -->
  <defs>
    <linearGradient id="ring" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="iris" cx="29.5" cy="29.5" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7E0FF"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E2F7A"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2340"/><stop offset="1" stop-color="#0B1022"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22B8E0"/><stop offset=".45" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g id="mark" transform="translate(0 4)">
    <rect id="body" x="2" y="2" width="60" height="60" rx="18" fill="url(#body)"/>
    <circle id="lens" cx="32" cy="32" r="15" fill="#070B18"/>
    <circle id="lens-ring" cx="32" cy="32" r="17" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="84 16" transform="rotate(-16.2 32 32)"/>
    <g id="eye">
      <circle id="iris" cx="32" cy="32" r="7.5" fill="url(#iris)"/>
      <circle id="pupil" cx="32" cy="32" r="3.4" fill="#050814"/>
      <circle id="glint" cx="29.6" cy="29.4" r="1.5" fill="#FFFFFF"/>
    </g>
    <circle id="rec" cx="44.02" cy="19.98" r="3.6" fill="#F43F5E"/>
  </g>
  <text id="wordmark" x="78" y="51" font-family="Outfit, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#111318">ats<tspan fill="#F43F5E">-</tspan><tspan font-weight="500" fill="url(#word)">cctv</tspan></text>
</svg>
